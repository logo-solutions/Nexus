name: nexus

services:
  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus
    restart: unless-stopped
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms1200m -Xmx1200m -XX:MaxDirectMemorySize=1g -Djava.util.prefs.userRoot=/nexus-data/javaprefs
    ports:
      - "8081:8081"   # UI web + API
      - "8082:8082"   # connecteur HTTP dédié au repo Docker hosted
      - "5001-5004:5001-5004"   # factice : docker-candidat, -release, -proxy-public, -all
    volumes:
      - /Volumes/HDD6/03-Travail-Actif/nexus/nexus-data:/nexus-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
