---
# Cible jetable : un Docker-in-Docker, pour jouer le rôle de bout en bout
# (synchronisation, .env, docker compose up, contrôles) sans toucher la prod.
driver:
  name: docker
platforms:
  - name: compose-deploy-dind
    image: docker:27-dind
    pre_build_image: true
    privileged: true
    command: dockerd-entrypoint.sh
    env:
      DOCKER_TLS_CERTDIR: ""
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..
    # Les playbooks create/destroy du pilote docker (molecule-plugins) ne
    # passent pas encore les conditions strictes d'ansible-core 2.19.
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "true"
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
