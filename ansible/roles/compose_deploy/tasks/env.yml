---
- name: Vérifier les secrets obligatoires
  ansible.builtin.assert:
    that: (compose_deploy_secrets[item] | default('')) | length > 0
    fail_msg: "Secret manquant : {{ item }}"
    quiet: true
  loop: "{{ compose_deploy_required_secrets }}"

# diff: false — sans quoi --diff afficherait les secrets.
- name: Écrire le .env
  ansible.builtin.copy:
    dest: "{{ compose_deploy_dir }}/.env"
    content: |
      {% for name, value in compose_deploy_secrets | dictsort %}
      {{ name }}={{ value }}
      {% endfor %}
    mode: "0600"
    backup: true
  no_log: true
  diff: false
