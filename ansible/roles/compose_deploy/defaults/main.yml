---
compose_deploy_compose_file: docker-compose.yml
# Vide = compose utilisé en place, sans synchronisation.
compose_deploy_archive: ""
# Vide = pas de --env-file (pile sans .env).
compose_deploy_env_file: .env
compose_deploy_prune_images: true
# Vide = nom déduit du dossier (ou du champ name: du compose).
compose_deploy_project_name: ""
compose_deploy_release_root: "~/.compose-deploy-releases"
compose_deploy_site_url: ""
compose_deploy_proxy_service: ""
compose_deploy_pull_services: []
compose_deploy_required_containers: []
compose_deploy_health_checks: []
compose_deploy_post_up_commands: []
compose_deploy_health_retries: 30
compose_deploy_health_delay: 5

compose_deploy_manage_env: false
compose_deploy_secrets: {}
compose_deploy_required_secrets:
  - DB_PASSWORD
  - JWT_SECRET
  - KC_DB_PASSWORD
  - KC_ADMIN_PASSWORD
  - OAUTH2_CLIENT_ID
  - OAUTH2_CLIENT_SECRET
  - OAUTH2_COOKIE_SECRET

compose_deploy_registry: ghcr.io
compose_deploy_registry_user: ""
compose_deploy_registry_token: ""

# Hors dépôt mais utiles à la prod : jamais supprimés par la synchronisation.
compose_deploy_preserved_paths:
  - /.env
  - /.env.backup
  - /.env.*~
  - /backups/
  - /logs/
  - /scripts/backup-restore/logs/
